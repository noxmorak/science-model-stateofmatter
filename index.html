<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สถานะของสสารตามอุณหภูมิ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<style>
  :root {
    --bg: #e4e9ec; --ink: #1d2a33; --soft: #52626d; --panel: rgba(255,255,255,.72);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #151c21; --ink: #e3ebf0; --soft: #94a5b0; --panel: rgba(21,28,33,.8); }
  }
  :root[data-theme="dark"] { --bg: #151c21; --ink: #e3ebf0; --soft: #94a5b0; --panel: rgba(21,28,33,.8); }

  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Noto Sans Thai", "Sarabun", "Leelawadee UI", Tahoma, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  canvas { display: block; }

  #info { position: fixed; left: 18px; right: 18px; top: calc(14px + env(safe-area-inset-top, 0px)); pointer-events: none; max-width: 440px; }
  #info p { margin: 0; }
  .title { font-size: .85rem; color: var(--soft); }
  #stateName { margin: 2px 0 4px; font-size: 1.9rem; line-height: 1.2; font-weight: 700; }
  #stateNote { font-size: .95rem; line-height: 1.5; }
  #stateStat { font-size: .85rem; color: var(--soft); margin-top: 4px; min-height: 1.3em; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: .8rem; color: var(--soft); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .tip { font-size: .78rem; color: var(--soft); margin-top: 8px; }

  #controls { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 760px; margin: 0 auto; padding: 12px 14px 10px; background: var(--panel); border-radius: 10px; backdrop-filter: blur(6px); }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .row label { font-size: .9rem; color: var(--soft); }
  #temp { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; margin: 0; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #2f6fb0 0 20%, #1d9a96 20% 40%, #d39a2a 40% 60%, #e0702a 60% 80%, #e0506f 80% 100%); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #2f6fb0 0 20%, #1d9a96 20% 40%, #d39a2a 40% 60%, #e0702a 60% 80%, #e0506f 80% 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -7px; border-radius: 50%; background: var(--ink); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--soft); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--soft); }
  input[type=range]:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }

  .scale { position: relative; margin: 2px 11px 0; height: 16px; font-size: .72rem; color: var(--soft); font-variant-numeric: tabular-nums; }
  .scale span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .names { display: grid; grid-template-columns: repeat(5, 1fr); height: auto; margin-top: 4px; text-align: center; }
  .names span { position: static; transform: none; white-space: normal; line-height: 1.25; padding: 0 2px; }
  .names span.on { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<div id="view"></div>

<div id="info">
  <p class="title">สถานะของสสารตามอุณหภูมิ</p>
  <h1 id="stateName"></h1>
  <p id="stateNote"></p>
  <p id="stateStat"></p>
  <div class="legend">
    <span><i id="lgAtom"></i>อะตอม</span>
    <span><i style="background:#e0506f"></i>ไอออนบวก</span>
    <span><i style="background:#5ec8ff"></i>อิเล็กตรอนอิสระ</span>
  </div>
  <p class="tip">ลากเพื่อหมุนมุมมอง เลื่อนล้อเมาส์หรือบีบนิ้วเพื่อซูม</p>
</div>

<section id="controls">
  <div class="row"><label for="slider">อุณหภูมิ</label><output id="temp" for="slider"></output></div>
  <input id="slider" type="range" min="0" max="1000" step="1" value="100">
  <div class="scale" id="ticks"></div>
  <div class="scale names" id="names"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var host = document.getElementById('view');
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  host.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  var camDist = 12, fit = 1;
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  var sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(5, 8, 10);
  scene.add(sun);

  var world = new THREE.Group();
  world.rotation.set(0.3, -0.5, 0);
  scene.add(world);

  var BOX = 4.4, H = BOX / 2, NM = 64, R = 0.2, BOND = 0.5;
  var hiY = H;   // ceiling, comes down for the liquid

  world.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(BOX, BOX, BOX)),
    new THREE.LineBasicMaterial({ color: 0x8a9aa5, transparent: true, opacity: 0.75 })
  ));

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function randDir() { return new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize(); }

  var ballGeo = new THREE.SphereGeometry(1, 14, 10);
  var rodGeo = new THREE.CylinderGeometry(0.06, 0.06, 1, 8);
  var atomMat = new THREE.MeshStandardMaterial({ color: 0x2f6fb0, roughness: 0.45, metalness: 0.05 });
  var ionMat = new THREE.MeshBasicMaterial({ color: 0xe0506f });
  var eMat = new THREE.MeshBasicMaterial({ color: 0x5ec8ff });
  var rodMat = new THREE.MeshStandardMaterial({ color: 0xaab7bf, roughness: 0.6 });

  var atoms = [], mols = [];
  for (var ix = 0; ix < 4; ix++) for (var iy = 0; iy < 4; iy++) for (var iz = 0; iz < 4; iz++) {
    var cx = (ix - 1.5) * 0.95, cy = (iy - 1.5) * 0.95, cz = (iz - 1.5) * 0.95;
    var rod = new THREE.Mesh(rodGeo, rodMat);
    world.add(rod);
    mols.push({ rod: rod, th: Math.random() });
    [-1, 1].forEach(function (s) {
      var m = new THREE.Mesh(ballGeo, atomMat);
      m.scale.setScalar(R);
      var home = new THREE.Vector3(cx + s * BOND / 2, cy, cz);
      m.position.copy(home);
      world.add(m);
      var e = new THREE.Mesh(ballGeo, eMat);
      e.scale.setScalar(0.07);
      e.visible = false;
      world.add(e);
      atoms.push({ m: m, e: e, home: home, v: randDir().multiplyScalar(0.3), ev: new THREE.Vector3(), thIon: Math.random(), ion: false });
    });
  }

  var MODES = ['solid', 'liquid', 'gas', 'breakdown', 'transition', 'plasma'];
  var TXT = {
    solid:      ['ของแข็ง', 'โมเลกุลอยู่ในตำแหน่งคงที่เป็นระเบียบ และสั่นอยู่กับที่เล็กน้อย', 'ต่ำกว่าจุดเยือกแข็งของน้ำ (0 °C)'],
    liquid:     ['ของเหลว', 'โมเลกุลอยู่ชิดกันแต่เคลื่อนที่ไถลผ่านกันได้ จึงไหลและเปลี่ยนรูปตามภาชนะ', 'ระหว่างจุดเยือกแข็ง (0 °C) กับจุดเดือด (100 °C) ของน้ำ'],
    gas:        ['แก๊ส', 'โมเลกุลอยู่ห่างกันมาก เคลื่อนที่เร็วและชนผนังภาชนะอยู่ตลอดเวลา', 'สูงกว่าจุดเดือดของน้ำ (100 °C)'],
    breakdown:  ['โมเลกุลแตกสลาย', 'พลังงานความร้อนสูงจนพันธะระหว่างอะตอมขาด โมเลกุลแยกเป็นอะตอมเดี่ยว', ''],
    transition: ['กำลังเปลี่ยนเป็นพลาสมา', 'อะตอมเริ่มสูญเสียอิเล็กตรอน กลายเป็นไอออนบวกกับอิเล็กตรอนอิสระ ปะปนกับอะตอมที่ยังเป็นกลาง', ''],
    plasma:     ['พลาสมา', 'อะตอมแตกตัวเป็นไอออนทั้งหมด เหลือเพียงไอออนบวกและอิเล็กตรอนอิสระที่เคลื่อนที่เร็วมาก', '']
  };
  var ATOM_COL = { solid: 0x2f6fb0, liquid: 0x1d9a96, gas: 0xd39a2a, breakdown: 0xe0702a, transition: 0xe8a23a, plasma: 0xe8a23a };

  // slider is split in 5 equal pieces, otherwise the solid band (10 degrees) would be a sliver
  var BP = [-10, 0, 100, 2000, 5000, 10000];
  function posToTemp(p) {
    var s = Math.min(4, Math.floor(p / 200)), f = (p - s * 200) / 200;
    return BP[s] + f * (BP[s + 1] - BP[s]);
  }
  function modeOf(T) {
    if (T < 0) return 'solid';
    if (T < 100) return 'liquid';
    if (T < 2000) return 'gas';
    if (T < 5000) return 'breakdown';
    if (T < 10000) return 'transition';
    return 'plasma';
  }

  var slider = document.getElementById('slider');
  var tempEl = document.getElementById('temp');
  var T = posToTemp(+slider.value), mode = '', lastStat = '';
  var nameEls = [];

  var ticks = document.getElementById('ticks'), names = document.getElementById('names');
  BP.forEach(function (b, i) {
    var s = document.createElement('span');
    s.style.left = (i * 20) + '%';
    s.textContent = b.toLocaleString('en-US');
    ticks.appendChild(s);
  });
  ['ของแข็ง', 'ของเหลว', 'แก๊ส', 'โมเลกุลแตก', 'เริ่มเป็นพลาสมา'].forEach(function (n) {
    var s = document.createElement('span');
    s.textContent = n;
    names.appendChild(s);
    nameEls.push(s);
  });

  function refreshText(brokenPct, ionPct) {
    var t = TXT[mode];
    document.getElementById('stateName').textContent = t[0];
    document.getElementById('stateNote').textContent = t[1];
    var stat = t[2];
    if (mode === 'breakdown') stat = 'พันธะที่ขาดแล้ว ' + brokenPct + '%';
    if (mode === 'transition' || mode === 'plasma') stat = 'อะตอมที่แตกตัวเป็นไอออน ' + ionPct + '%';
    if (stat !== lastStat) { document.getElementById('stateStat').textContent = stat; lastStat = stat; }
    var idx = Math.min(4, MODES.indexOf(mode));
    nameEls.forEach(function (el, i) { el.className = i === idx ? 'on' : ''; });
  }

  function onSlide() {
    T = posToTemp(+slider.value);
    var shown = (+slider.value < 200) ? T.toFixed(1) : Math.round(T).toLocaleString('en-US');
    tempEl.textContent = shown + ' °C';
    slider.setAttribute('aria-valuetext', shown + ' องศาเซลเซียส');
  }
  slider.addEventListener('input', onSlide);
  onSlide();

  // ---- rotate / zoom
  var dragging = false, lastX = 0, lastY = 0, pointers = {}, pinch0 = 0, cam0 = 12;
  function pdist() {
    var a = Object.keys(pointers).map(function (k) { return pointers[k]; });
    return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
  }
  host.addEventListener('pointerdown', function (e) {
    host.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    host.classList.add('drag');
    if (Object.keys(pointers).length === 2) { pinch0 = pdist(); cam0 = camDist; }
  });
  host.addEventListener('pointermove', function (e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(pointers).length === 2) { camDist = clamp(cam0 * pinch0 / pdist(), 7, 24); return; }
    if (!dragging) return;
    world.rotation.y += (e.clientX - lastX) * 0.008;
    world.rotation.x = clamp(world.rotation.x + (e.clientY - lastY) * 0.008, -1.5, 1.5);
    lastX = e.clientX; lastY = e.clientY;
  });
  function release(e) {
    delete pointers[e.pointerId];
    if (!Object.keys(pointers).length) { dragging = false; host.classList.remove('drag'); }
  }
  host.addEventListener('pointerup', release);
  host.addEventListener('pointercancel', release);
  host.addEventListener('wheel', function (e) {
    e.preventDefault();
    camDist = clamp(camDist + e.deltaY * 0.01, 7, 24);
  }, { passive: false });

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    fit = w / h < 0.8 ? 1.6 : (w / h < 1.3 ? 1.25 : 1);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- simulation
  var tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
  var legend = document.getElementById('lgAtom');

  function wall(p, v, r, topY) {
    if (p.x < -H + r) { p.x = -H + r; v.x = Math.abs(v.x); }
    if (p.x > H - r) { p.x = H - r; v.x = -Math.abs(v.x); }
    if (p.y < -H + r) { p.y = -H + r; v.y = Math.abs(v.y); }
    if (p.y > topY - r) { p.y = topY - r; v.y = -Math.abs(v.y); }
    if (p.z < -H + r) { p.z = -H + r; v.z = Math.abs(v.z); }
    if (p.z > H - r) { p.z = H - r; v.z = -Math.abs(v.z); }
  }

  function targetSpeed() {
    if (mode === 'liquid') return 0.8 + (T / 100) * 0.6;
    if (mode === 'gas') return 2 + (T - 100) / 1900 * 2;
    if (mode === 'breakdown') return 4 + (T - 2000) / 3000 * 1.5;
    return 5.5;
  }

  var prevBrokenPct = -1, prevIonPct = -1;

  function step(dt, t) {
    var newMode = modeOf(T);
    var broken = clamp((T - 2000) / 3000, 0, 1);
    var ionF = clamp((T - 5000) / 5000, 0, 1);
    var bp = Math.round(broken * 100), ip = Math.round(ionF * 100);
    if (newMode !== mode || bp !== prevBrokenPct || ip !== prevIonPct) {
      mode = newMode; prevBrokenPct = bp; prevIonPct = ip;
      refreshText(bp, ip);
    }

    atomMat.color.lerp(new THREE.Color(ATOM_COL[mode]), Math.min(1, dt * 4));
    legend.style.background = '#' + atomMat.color.getHexString();

    var ceil = mode === 'liquid' ? -H + BOX * 0.45 : H;
    hiY += (ceil - hiY) * Math.min(1, dt * 3);

    var i, j, a, b, sp = targetSpeed();

    if (mode === 'solid') {
      for (i = 0; i < atoms.length; i++) {
        a = atoms[i];
        tmp.copy(a.m.position).sub(a.home);
        a.v.x += (-40 * tmp.x - 10 * a.v.x + rnd(-1, 1) * 25) * dt;
        a.v.y += (-40 * tmp.y - 10 * a.v.y + rnd(-1, 1) * 25) * dt;
        a.v.z += (-40 * tmp.z - 10 * a.v.z + rnd(-1, 1) * 25) * dt;
        if (a.v.length() > 8) a.v.setLength(8);
        a.m.position.addScaledVector(a.v, dt);
      }
    } else {
      // bonds act as springs while they still exist
      for (i = 0; i < NM; i++) {
        if (mols[i].th < broken) continue;
        a = atoms[2 * i]; b = atoms[2 * i + 1];
        tmp.copy(b.m.position).sub(a.m.position);
        var len = tmp.length();
        if (len < 1e-4) continue;
        tmp.multiplyScalar(1 / len);
        var rv = tmp2.copy(b.v).sub(a.v).dot(tmp);
        var f = (70 * (len - BOND) + 2 * rv) * dt;
        a.v.addScaledVector(tmp, f);
        b.v.addScaledVector(tmp, -f);
      }
      for (i = 0; i < atoms.length; i++) {
        a = atoms[i];
        if (mode === 'liquid') a.v.y -= 2.5 * dt;
        var s = a.v.length();
        if (s < 1e-3) { a.v.copy(randDir()); s = 1; }
        a.v.multiplyScalar(1 + (sp / s - 1) * Math.min(1, dt * 2));
        a.m.position.addScaledVector(a.v, dt);
        wall(a.m.position, a.v, R, hiY);
      }
      if (mode === 'liquid') {
        for (i = 0; i < atoms.length; i++) for (j = i + 1; j < atoms.length; j++) {
          if (j === (i ^ 1)) continue;
          tmp.copy(atoms[i].m.position).sub(atoms[j].m.position);
          var d = tmp.length();
          if (d < 0.46 && d > 1e-4) {
            tmp.multiplyScalar((0.46 - d) / d * 0.5);
            atoms[i].m.position.add(tmp);
            atoms[j].m.position.sub(tmp);
          }
        }
      }
    }

    // ionisation: each atom has its own threshold
    for (i = 0; i < atoms.length; i++) {
      a = atoms[i];
      var shouldIon = a.thIon < ionF;
      if (shouldIon && !a.ion) {
        a.ion = true;
        a.m.material = ionMat;
        a.e.visible = true;
        a.e.position.copy(a.m.position);
        a.ev.copy(randDir()).multiplyScalar(rnd(7, 11));
      } else if (!shouldIon && a.ion) {
        a.ion = false;
        a.m.material = atomMat;
        a.e.visible = false;
      }
      if (a.ion) {
        a.e.position.addScaledVector(a.ev, dt);
        wall(a.e.position, a.ev, 0.07, H);
        a.e.scale.setScalar(0.07 * (1 + 0.4 * Math.sin(t * 15 + i)));
      }
    }

    // draw the bonds
    for (i = 0; i < NM; i++) {
      var m = mols[i], bonded = m.th >= broken;
      m.rod.visible = bonded;
      if (!bonded) continue;
      a = atoms[2 * i].m.position; b = atoms[2 * i + 1].m.position;
      tmp.copy(b).sub(a);
      var L = tmp.length();
      m.rod.position.copy(a).addScaledVector(tmp, 0.5);
      m.rod.scale.set(1, L, 1);
      if (L > 1e-4) m.rod.quaternion.setFromUnitVectors(UP, tmp.multiplyScalar(1 / L));
    }
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.033);
    last = now;
    step(dt, now / 1000);
    camera.position.set(0, 0, camDist * fit);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
